name: Run Playwright Login Logout Bot Daily

on: # Event that triggers the workflow
  schedule:
    - cron: '0 6 * * *' # Midnight CST = 6 AM UTC
  # workflow_dispatch: Optional: allows manual triggering

jobs: # One or more jobs that run
  run-playwright:
    runs-on: ubuntu-latest # Environment to run the job in
    env:
      USER_NAME: ${{ secrets.USER_NAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps: # Series of shell commands
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests #run Playwright test runner
        run: npx playwright test
